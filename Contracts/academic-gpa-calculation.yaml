openapi: 3.0.3

info:
  title: UNAPLANNER API
  description: |
    API RESTful para la plataforma UNAPLANNER de control académico.
    Campus Sarapiquí — Universidad Nacional de Costa Rica | I Ciclo 2026.


paths:
  /api/student/{id}/gpa:
    get:
      tags:
        - Student
      summary: Obtener GPA del estudiante
      description: Calcula el promedio académico basado en materias aprobadas y calificaciones finales válidas.
      parameters:
        - name: id
          in: path
          required: true
          description: ID del estudiante
          schema:
            type: integer
            example: 1
      responses:
        "200":
          description: GPA calculado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentGpaResponse'

        "400":
          description: Solicitud inválida (ID incorrecto o parámetros inválidos)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        "404":
          description: Estudiante no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    StudentGpaResponse:
      type: object
      properties:
        studentId:
          type: integer
          example: 1
        gpa:
          type: number
          format: float
          example: 87.5

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: "Error al calcular el GPA"
        code:
          type: integer
          example: 500