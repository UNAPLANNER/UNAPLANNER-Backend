openapi: 3.0.3

info:
  title: UNAPLANNER API - Student Calendar
  version: 1.0.0
  description: |
    Especificación de los endpoints para obtener el calendario académico de un estudiante.
    Permite visualizar eventos como exámenes y tareas con detalles específicos.
    Campus Sarapiquí — Universidad Nacional de Costa Rica | I Ciclo 2026.

paths:
  /api/student/{id}/calendar:
    get:
      tags:
        - Student Calendar
      summary: Obtener calendario del estudiante
      description: |
        Obtiene todos los eventos del calendario del estudiante, incluyendo exámenes, tareas y proyectos.
        Los eventos se retornan ordenados por fecha de actividad.
        Incluye estadísticas de resumen (total de eventos, próximos eventos, completados, etc.).
      operationId: getStudentCalendar
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID del estudiante
          example: 1
      responses:
        "200":
          description: Calendario del estudiante obtenido exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentCalendarResponse'
              example:
                events:
                  - id: 1
                    title: "Examen Final - Estructuras de Datos"
                    description: "Examen comprensivo de la materia"
                    activityDate: "2026-06-15T14:00:00"
                    activityType: "Exam"
                    courseId: 101
                    courseName: "Estructuras de Datos"
                    hasReminder: true
                    reminderDate: "2026-06-14T14:00:00"
                    isCompleted: false
                    createdDate: "2026-05-20T10:30:00"
                  - id: 2
                    title: "Entrega de Proyecto Final"
                    description: "Proyecto integrador del semestre"
                    activityDate: "2026-06-10T23:59:00"
                    activityType: "Project"
                    courseId: 102
                    courseName: "Ingeniería de Software"
                    hasReminder: true
                    reminderDate: "2026-06-08T23:59:00"
                    isCompleted: false
                    createdDate: "2026-05-20T10:30:00"
                summary:
                  totalEvents: 8
                  upcomingEvents: 6
                  completedEvents: 2
                  examsCount: 3
                  assignmentsCount: 5
        "404":
          description: Estudiante no encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Estudiante con ID 99 no encontrado"
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Error al obtener el calendario del estudiante"
                  error:
                    type: string

  /api/student/{id}/calendar/{eventId}:
    get:
      tags:
        - Student Calendar
      summary: Obtener detalles de un evento específico
      description: |
        Obtiene la información detallada de un evento específico del calendario del estudiante.
        Incluye información del curso asociado, recordatorios y estado de finalización.
      operationId: getEventDetail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID del estudiante
          example: 1
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
          description: ID del evento del calendario
          example: 1
      responses:
        "200":
          description: Detalles del evento obtenidos exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarEventResponse'
              example:
                id: 1
                title: "Examen Final - Estructuras de Datos"
                description: "Examen comprensivo de la materia cobriendo todos los temas del semestre"
                activityDate: "2026-06-15T14:00:00"
                activityType: "Exam"
                courseId: 101
                courseName: "Estructuras de Datos"
                hasReminder: true
                reminderDate: "2026-06-14T14:00:00"
                isCompleted: false
                createdDate: "2026-05-20T10:30:00"
        "404":
          description: Estudiante o evento no encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Evento del calendario con ID 99 no encontrado"
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Error al obtener los detalles del evento"
                  error:
                    type: string

  /api/student/{id}/calendar/filter/date-range:
    get:
      tags:
        - Student Calendar
      summary: Obtener calendario filtrado por rango de fechas
      description: |
        Obtiene los eventos del calendario del estudiante dentro de un rango de fechas específico.
        Útil para visualizar eventos por semana, mes o período personalizado.
      operationId: getCalendarByDateRange
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID del estudiante
          example: 1
        - name: startDate
          in: query
          required: true
          schema:
            type: string
            format: date
          description: Fecha de inicio en formato ISO 8601 (yyyy-MM-dd)
          example: "2026-06-01"
        - name: endDate
          in: query
          required: true
          schema:
            type: string
            format: date
          description: Fecha final en formato ISO 8601 (yyyy-MM-dd)
          example: "2026-06-30"
      responses:
        "200":
          description: Calendario filtrado obtenido exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentCalendarResponse'
        "400":
          description: Rango de fechas inválido
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "La fecha de inicio debe ser anterior a la fecha final"
        "404":
          description: Estudiante no encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Estudiante con ID 99 no encontrado"
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Error al obtener el calendario del estudiante"
                  error:
                    type: string

  /api/student/{id}/calendar/filter/activity-type:
    get:
      tags:
        - Student Calendar
      summary: Obtener calendario filtrado por tipo de actividad
      description: |
        Obtiene los eventos del calendario filtrados por tipo de actividad específico (Exam, Assignment, Project, etc.).
        Permite a los estudiantes ver solamente los eventos que les interesan.
      operationId: getCalendarByActivityType
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID del estudiante
          example: 1
        - name: activityType
          in: query
          required: true
          schema:
            type: string
            enum:
              - Exam
              - Assignment
              - Project
              - Other
          description: Tipo de actividad a filtrar
          example: "Exam"
      responses:
        "200":
          description: Calendario filtrado obtenido exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentCalendarResponse'
        "400":
          description: Parámetros inválidos
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "El tipo de actividad es requerido"
        "404":
          description: Estudiante no encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Estudiante con ID 99 no encontrado"
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Error al obtener el calendario del estudiante"
                  error:
                    type: string

components:
  schemas:
    CalendarEventResponse:
      type: object
      required:
        - id
        - title
        - activityDate
        - activityType
        - createdDate
      properties:
        id:
          type: integer
          description: ID único del evento del calendario
          example: 1
        title:
          type: string
          description: Título del evento (ej, "Examen Final - Estructuras de Datos")
          example: "Examen Final - Estructuras de Datos"
        description:
          type: string
          nullable: true
          description: Descripción opcional del evento
          example: "Examen comprensivo de la materia cobriendo todos los temas del semestre"
        activityDate:
          type: string
          format: date-time
          description: Fecha y hora cuando ocurre el evento
          example: "2026-06-15T14:00:00"
        activityType:
          type: string
          description: Tipo de actividad (Exam, Assignment, Project, etc.)
          enum:
            - Exam
            - Assignment
            - Project
            - Other
          example: "Exam"
        courseId:
          type: integer
          nullable: true
          description: ID del curso asociado con el evento
          example: 101
        courseName:
          type: string
          nullable: true
          description: Nombre del curso asociado
          example: "Estructuras de Datos"
        hasReminder:
          type: boolean
          description: Indica si se ha configurado un recordatorio
          example: true
        reminderDate:
          type: string
          format: date-time
          nullable: true
          description: Fecha y hora del recordatorio
          example: "2026-06-14T14:00:00"
        isCompleted:
          type: boolean
          description: Indica si el evento ha sido marcado como completado
          example: false
        createdDate:
          type: string
          format: date-time
          description: Fecha y hora de creación del evento
          example: "2026-05-20T10:30:00"

    CalendarSummaryStats:
      type: object
      properties:
        totalEvents:
          type: integer
          description: Número total de eventos en el calendario del estudiante
          example: 8
        upcomingEvents:
          type: integer
          description: Número de eventos próximos (no completados y con fecha futura)
          example: 6
        completedEvents:
          type: integer
          description: Número de eventos completados
          example: 2
        examsCount:
          type: integer
          description: Cantidad de exámenes programados
          example: 3
        assignmentsCount:
          type: integer
          description: Cantidad de tareas/proyectos programados
          example: 5

    StudentCalendarResponse:
      type: object
      required:
        - events
        - summary
      properties:
        events:
          type: array
          description: Lista de eventos del calendario ordenados por fecha
          items:
            $ref: '#/components/schemas/CalendarEventResponse'
        summary:
          $ref: '#/components/schemas/CalendarSummaryStats'
