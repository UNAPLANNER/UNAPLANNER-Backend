openapi: 3.0.3

info:
  title: UNAPLANNER API
  description: |
    API RESTful para la plataforma UNAPLANNER de control académico.
    Campus Sarapiquí — Universidad Nacional de Costa Rica | I Ciclo 2026.

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        "200":
          description: Login exitoso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'

components:
  schemas:
    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
    AuthResponse:
      type: object
      properties:
        token:
          type: string

  responses:
    BadRequest:
      description: Error en la solicitud (datos inválidos).
    Unauthorized:
      description: No autorizado (credenciales incorrectas).
