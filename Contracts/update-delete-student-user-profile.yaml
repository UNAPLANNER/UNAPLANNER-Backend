openapi: 3.0.3

info:
  title: UNAPLANNER API
  description: |
    API RESTful para la plataforma UNAPLANNER de control académico.
    Campus Sarapiquí — Universidad Nacional de Costa Rica | I Ciclo 2026.

  
  
  /users/{userId}/profile:
    put:
      tags:
        - Users
      summary: Actualizar perfil del estudiante
      description: Permite actualizar el nombre, carrera y año de ingreso del estudiante.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStudentProfileRequest'
      responses:
        "200":
          description: Perfil actualizado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateStudentResponse'
        "400":
          description: Datos inválidos o estudiante no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/{id}:
    delete:
      tags:
        - Users
      summary: Eliminar usuario y datos asociados
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteUserRequest'
      responses:
        "200":
          description: Usuario eliminado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        "401":
          description: Contraseña incorrecta o no autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'